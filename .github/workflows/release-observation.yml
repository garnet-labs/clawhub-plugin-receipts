name: Release observation

on:
  push:
    branches: [main]
    paths: ['recall/**', '.github/workflows/release-observation.yml']
  pull_request:
    paths: ['recall/**', '.github/workflows/release-observation.yml']

permissions: {}

jobs:
  observe:
    name: Observe ${{ matrix.plugin }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        plugin: [discord, memory-lancedb]
    env:
      RELEASE_PLUGIN: ${{ matrix.plugin }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.3'
      - name: Prepare runtime
        run: bash recall/observe.sh prepare "$RELEASE_PLUGIN"
      - uses: garnet-org/action@673a06d87748bec49e4d8df22d371b2a3420aba4 # v2.5.2
        with:
          job_index: ${{ strategy.job-index }}
          job_total: ${{ strategy.job-total }}
      - name: Install and list
        run: bash recall/observe.sh install "$RELEASE_PLUGIN"
      - name: First load
        run: bash recall/observe.sh first-load "$RELEASE_PLUGIN"
      - name: Let sensor settle
        if: always()
        run: sleep 30
